# Cargo workspace is a convenience for `cargo test --workspace`.
# Make (root Makefile) is the monorepo organizer; there is no Mix umbrella.
# Member roles: see docs/maintainer.md.
[workspace]
resolver = "2"
members = [
    "libs/rust/arkfs_core",                 # types, codec, paths, quorum, attr_map
    "libs/rust/simulation_harness",         # deterministic clock / delay / chaos
    "libs/rust/persistent_object_store",    # CAS + safe-write + replication trait
    "libs/rust/temporal_core",              # versioned POSIX tree (cactus index)
    "libs/rust/fuse_facade",                # Linux FUSE adapter over TemporalCore
    "apps/arkfs",                           # `arkfs mount|umount` CLI
    "libs/rust/test_review",                # test NDJSON logs (dev-dependency only)
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
arkfs_core = { path = "libs/rust/arkfs_core" }
simulation_harness = { path = "libs/rust/simulation_harness" }
persistent_object_store = { path = "libs/rust/persistent_object_store" }
temporal_core = { path = "libs/rust/temporal_core" }
fuse_facade = { path = "libs/rust/fuse_facade" }
arkfs_test_review = { path = "libs/rust/test_review" }
blake3 = "1.5"
fuser = { version = "0.15", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tempfile = "3.14"

# Kani proofs live under `#[cfg(kani)]`. Teach rustc that `kani` is an expected cfg
# so `cargo test` does not warn about unexpected_cfgs.
#
# Note: the inner check-cfg form produces "unused manifest key" warnings on
# recent stable. We register the cfg via RUSTFLAGS for kani runs (local only).
# GitHub CI never runs Kani/Miri.
[workspace.lints.rust]
unexpected_cfgs = "warn"
