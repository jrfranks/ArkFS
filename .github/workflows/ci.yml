# Minimal GitHub bar. Must stay runnable on ubuntu-latest without /dev/fuse,
# Kani, Miri, or llvm-cov. Full proofs run locally via `make prepush`
# (`.githooks/pre-push`). See docs/maintainer.md ("How to build and test").
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: make ci (minimal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Minimal tests (no proofs)
        run: make ci
