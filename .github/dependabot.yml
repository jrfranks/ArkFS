# Weekly Cargo + Actions bumps. Review blake3 / fuser / thiserror carefully:
# fuser ABI features (abi-7-31) are required for fallocate/lseek.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
